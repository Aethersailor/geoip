name: CodeQL
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  schedule:
  - cron: 8 3 * * 1
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build_mode: none
        - language: go
          build_mode: manual
    steps:
    - name: Checkout source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum
    - name: Initialize CodeQL
      uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build_mode }}
        queries: security-extended
    - name: Build Go sources for analysis
      if: matrix.language == 'go'
      run: |
        go build ./...
    - name: Analyze source
      uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6
      with:
        category: /language:${{ matrix.language }}
